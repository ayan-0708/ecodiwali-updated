<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0B132B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#bgGlow)"/>
  
  <!-- Subtle festive border -->
  <rect x="8" y="8" width="584" height="384" rx="16" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="2"/>
  <rect x="14" y="14" width="572" height="372" rx="12" fill="none" stroke="rgba(255, 215, 0, 0.08)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Decorative Corner Motifs -->
  <path d="M 24 40 L 40 24 M 24 24 L 48 24 M 24 24 L 24 48" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 576 40 L 560 24 M 576 24 L 552 24 M 576 24 L 576 48" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Center Visual Artwork -->
  <g transform="translate(300, 180)">
    
  <!-- Multi-layered aerial breaks across panoramic sky -->
  <g filter="url(#neonGlow)">
    <!-- Left Burst (Cyan/Teal) -->
    <g transform="translate(-100, -50)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="31.81980515339464" y2="31.819805153394636" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="2.7554552980815448e-15" y2="45" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="-31.819805153394636" y2="31.81980515339464" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="-45" y2="5.5109105961630896e-15" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="-31.819805153394647" y2="-31.819805153394636" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="-8.266365894244634e-15" y2="-45" stroke="#00F2FE" stroke-width="2.5"/><line x1="0" y1="0" x2="31.81980515339463" y2="-31.819805153394647" stroke="#00F2FE" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#FFF"/>
    </g>

    <!-- Center Giant Burst (Golden Brocade) -->
    <g transform="translate(0, -60)">
      <line x1="0" y1="0" x2="75" y2="0" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="67.58077659915686" y2="32.524431344065825" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="46.79096975320397" y2="58.6140354314114" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="16.743758700821356" y2="73.10708956434163" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-16.616137321460048" y2="73.13620157291724" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-46.688597747821454" y2="58.695611763931055" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-67.52390785516451" y2="32.64233245292457" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-74.99988576849658" y2="0.1308996274423742" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-67.63743948038353" y2="-32.40643116014868" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-46.89319922517788" y2="-58.532280550374736" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="-16.871329075789895" y2="-73.07775485889263" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="16.488465326462766" y2="-73.16509079593925" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="46.586083520873274" y2="-58.777009299437985" stroke="#FFD700" stroke-width="3"/><line x1="0" y1="0" x2="67.46683342163848" y2="-32.760134127577764" stroke="#FFD700" stroke-width="3"/>
      <circle cx="0" cy="0" r="11" fill="#FFF"/>
    </g>

    <!-- Right Burst (Magenta/Violet) -->
    <g transform="translate(100, -40)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="40.45084971874737" y2="29.389262614623657" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="15.450849718747373" y2="47.552825814757675" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="-15.450849718747367" y2="47.55282581475768" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="-40.450849718747364" y2="29.38926261462366" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="-50" y2="6.123233995736766e-15" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="-40.45084971874737" y2="-29.38926261462365" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="-15.450849718747378" y2="-47.552825814757675" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="15.450849718747362" y2="-47.55282581475768" stroke="#FF007F" stroke-width="2.5"/><line x1="0" y1="0" x2="40.450849718747364" y2="-29.389262614623668" stroke="#FF007F" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="8" fill="#FFF"/>
    </g>
  </g>
  <!-- Foreground Festive Silhouettes -->
  <path d="M -160,80 Q -100,40 -40,75 Q 30,30 90,70 Q 150,45 180,80 Z" fill="#0D152D" stroke="rgba(255, 215, 0, 0.4)" stroke-width="1.5"/>
  
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 42)">
    <rect width="130" height="28" rx="14" fill="url(#badgeGrad)" opacity="0.9"/>
    <text x="65" y="18" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">★ GRAND FINALE</text>
  </g>

  <!-- Lower Title Bar / Card Info -->
  <rect x="20" y="310" width="560" height="70" rx="14" fill="rgba(7, 11, 25, 0.85)" stroke="rgba(255, 215, 0, 0.2)" stroke-width="1"/>
  <text x="40" y="342" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Grand Finale / महा आतिशबाजी</text>
  <text x="40" y="364" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Spectacular synchronized multi-shot aerial symphony</text>
  
  <!-- Play Indicator Icon -->
  <g transform="translate(535, 345)">
    <circle r="18" fill="url(#goldGrad)" filter="url(#neonGlow)"/>
    <polygon points="-4,-7 8,0 -4,7" fill="#070B19"/>
  </g>
</svg>
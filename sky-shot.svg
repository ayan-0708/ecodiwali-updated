<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0B132B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#8338EC"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#bgGlow)"/>
  
  <!-- Subtle festive border -->
  <rect x="8" y="8" width="584" height="384" rx="16" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="2"/>
  <rect x="14" y="14" width="572" height="372" rx="12" fill="none" stroke="rgba(255, 215, 0, 0.08)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Decorative Corner Motifs -->
  <path d="M 24 40 L 40 24 M 24 24 L 48 24 M 24 24 L 24 48" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 576 40 L 560 24 M 576 24 L 552 24 M 576 24 L 576 48" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Center Visual Artwork -->
  <g transform="translate(300, 180)">
    
  <!-- High Altitude Starburst -->
  <g filter="url(#neonGlow)">
    <line x1="0" y1="-30" x2="90" y2="-30" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="90" cy="-30" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="83.1491579260158" y2="4.441508912858083" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="83.1491579260158" cy="4.441508912858083" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="63.63961030678928" y2="33.63961030678927" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="63.63961030678928" cy="33.63961030678927" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="34.44150891285808" y2="53.1491579260158" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34.44150891285808" cy="53.1491579260158" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="5.5109105961630896e-15" y2="60" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="5.5109105961630896e-15" cy="60" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-34.441508912858076" y2="53.1491579260158" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-34.441508912858076" cy="53.1491579260158" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-63.63961030678927" y2="33.63961030678928" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-63.63961030678927" cy="33.63961030678928" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-83.1491579260158" y2="4.44150891285809" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-83.1491579260158" cy="4.44150891285809" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-90" y2="-29.99999999999999" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-90" cy="-29.99999999999999" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-83.14915792601583" y2="-64.44150891285804" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-83.14915792601583" cy="-64.44150891285804" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-63.639610306789294" y2="-93.63961030678928" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-63.639610306789294" cy="-93.63961030678928" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-34.441508912858055" y2="-113.14915792601582" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-34.441508912858055" cy="-113.14915792601582" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="-1.6532731788489267e-14" y2="-120" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-1.6532731788489267e-14" cy="-120" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="34.4415089128581" y2="-113.1491579260158" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34.4415089128581" cy="-113.1491579260158" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="63.63961030678926" y2="-93.6396103067893" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="63.63961030678926" cy="-93.6396103067893" r="3.5" fill="#FFF"/><line x1="0" y1="-30" x2="83.14915792601582" y2="-64.44150891285807" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
      <circle cx="83.14915792601582" cy="-64.44150891285807" r="3.5" fill="#FFF"/>
    <circle cx="0" cy="-30" r="14" fill="#FFF"/>
  </g>
  <!-- Ascending Trail from Ground -->
  <path d="M 0,85 Q 15,30 0,-15" fill="none" stroke="#FFE066" stroke-width="2.5" stroke-dasharray="4,4" filter="url(#neonGlow)"/>
  <!-- Mortar Launcher Tube -->
  <rect x="-8" y="70" width="16" height="30" rx="3" fill="#2B2D42" stroke="#FFD700" stroke-width="2"/>
  
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 42)">
    <rect width="130" height="28" rx="14" fill="url(#badgeGrad)" opacity="0.9"/>
    <text x="65" y="18" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">HIGH CALIBER</text>
  </g>

  <!-- Lower Title Bar / Card Info -->
  <rect x="20" y="310" width="560" height="70" rx="14" fill="rgba(7, 11, 25, 0.85)" stroke="rgba(255, 215, 0, 0.2)" stroke-width="1"/>
  <text x="40" y="342" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Sky Shot / स्काई शॉट</text>
  <text x="40" y="364" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Single high-caliber shell with glittering chrysanthemum break</text>
  
  <!-- Play Indicator Icon -->
  <g transform="translate(535, 345)">
    <circle r="18" fill="url(#goldGrad)" filter="url(#neonGlow)"/>
    <polygon points="-4,-7 8,0 -4,7" fill="#070B19"/>
  </g>
</svg>